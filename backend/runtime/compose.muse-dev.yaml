# Separate project attaches only the tunnel to the existing backend network.
name: lookout-muse-dev
services:
  tunnel:
    image: ngrok/ngrok:latest
    profiles: [muse-dev]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Set NGROK_AUTHTOKEN in .env.local}
    command:
      - http
      - http://api:8080
      - --url=${NGROK_URL:?Set your assigned HTTPS ngrok URL in .env.local}
      - --inspect=false
      - --traffic-policy-file=/etc/ngrok/muse-dev-policy.yaml
      - --log=stdout
    networks: [backend]
    volumes:
      - ./muse-dev-policy.yaml:/etc/ngrok/muse-dev-policy.yaml:ro
    # Stop with the testing session; do not reopen a tunnel on Docker restart.
    restart: 'no'
    logging:
      driver: local
      options:
        max-size: '10m'
        max-file: '3'

networks:
  backend:
    external: true
    name: ${LOOKOUT_DOCKER_NETWORK:-lookout-backend_default}
