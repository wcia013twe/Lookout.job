name: lookout-backend
services:
  api:
    image: lookout-node:local
    build:
      context: ../..
      dockerfile: backend/runtime/Dockerfile
    container_name: lookout-node-api
    env_file: .env.local
    environment:
      LOOKOUT_PROCESS: api
      PORT: '8080'
    ports:
      - '127.0.0.1:8080:8080'
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
  worker:
    image: lookout-node:local
    container_name: lookout-node-worker
    env_file: .env.local
    environment:
      LOOKOUT_PROCESS: worker
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway'
