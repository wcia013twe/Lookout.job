on_http_request:
  - expressions:
      - "!(req.url.path in ['/mcp', '/agent-gateway/pending-count', '/agent-package/manifest.json', '/agent-package/lookout-agent-0.2.2.tgz'])"
    actions:
      - type: deny
  - actions:
      - type: add-headers
        config:
          headers:
            host: localhost:8080
