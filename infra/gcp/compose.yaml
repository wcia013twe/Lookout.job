name: lookout-cloud
services:
  api:
    image: lookout-node:${LOOKOUT_RELEASE:?release required}
    build:
      context: ../..
      dockerfile: backend/runtime/Dockerfile
    env_file:
      - path: /etc/lookout/runtime.env
        format: raw
    environment:
      LOOKOUT_PROCESS: api
      PORT: '8080'
    restart: unless-stopped
    init: true
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
    logging: &logging
      driver: local
      options: {max-size: '10m', max-file: '3'}
  worker:
    image: lookout-node:${LOOKOUT_RELEASE:?release required}
    env_file:
      - path: /etc/lookout/runtime.env
        format: raw
    environment:
      LOOKOUT_PROCESS: worker
      LOOKOUT_SEARCH_STAGING_DIR: /var/lib/lookout/search-runs
    volumes:
      - search_staging:/var/lib/lookout/search-runs
    restart: unless-stopped
    init: true
    logging: *logging
  proxy:
    image: caddy:2.10.2-alpine
    environment:
      LOOKOUT_API_HOST: ${LOOKOUT_API_HOST:?hostname required}
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    logging: *logging
volumes:
  caddy_data:
  caddy_config:
  search_staging:
    name: lookout-cloud-search-staging
