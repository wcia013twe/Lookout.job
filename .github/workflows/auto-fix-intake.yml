name: Acknowledge Muse bug reports
on:
  issues:
    types: [opened, labeled, reopened]
permissions:
  contents: read
  issues: write
concurrency:
  group: auto-fix-intake-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  acknowledge:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'auto-fix')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Notify owner without starting paid compute or merging
        run: node scripts/auto-fix-intake.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
