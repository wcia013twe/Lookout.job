name: Launch Codex cloud fix
on:
  issues:
    types: [opened, labeled, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Owner-authored auto-fix issue number
        required: true
        type: string
permissions:
  contents: read
  issues: write
concurrency:
  group: codex-cloud-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false
jobs:
  launch:
    if: >-
      github.event.sender.login == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.issue.state == 'open' && contains(github.event.issue.labels.*.name, 'auto-fix')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Submit one subscription-authenticated cloud task
        run: node scripts/auto-fix-launch.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CODEX_CLOUD_ENV_ID: ${{ vars.CODEX_CLOUD_ENV_ID }}
          CODEX_CLOUD_ACCESS_TOKEN: ${{ secrets.CODEX_CLOUD_ACCESS_TOKEN }}
